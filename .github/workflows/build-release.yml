on:
  workflow_dispatch:
    inputs:
      doxygen_source_version:
        description: 'Use latest tagged release of Doxygen, or master branch?'
        required: true
        default: 'tagged'
        type: choice
        options:
          - 'tagged'
          - 'master'
      rebuild_caches:
        description: 'Rebuild dependency caches from sources'
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - 'main'
  # Weekly scheduled run to keep caches warm
  schedule:
    - cron: '0 6 * * 6'

name: Create Doxygen Release

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  # LLVM_VERSION is defined in the LLVM and Doxygen job matrices as Ubuntu has only older versions available in main
  # See https://ubuntu.com/developers/docs/reference/availability/llvm/ and https://releases.llvm.org/
  QT6_VERSION: 6.10.3    # https://wiki.qt.io/Qt_6.10_Release
  XAPIAN_VERSION: 1.4.32 # https://xapian.org/
  ZLIB_VERSION: 1.4      # https://www.zlib.net/
  # SignPath (https://signpath.io) is used to code sign the Windows executables.
  # These values identify the SignPath organization/project/artifact-configuration
  # and can be overridden via repository variables, no workflow changes needed.
  SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
  SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG || 'doxygen' }}
  SIGNPATH_ARTIFACT_CONFIGURATION_BINARIES_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_BINARIES_SLUG || 'windows-x64' }}
  SIGNPATH_ARTIFACT_CONFIGURATION_INSTALLER_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_INSTALLER_SLUG || 'windows-installer' }}
  # 'test-signing' uses the self-signed test certificate provided by SignPath.
  # Once SignPath has reviewed the setup and imported the production certificate,
  # switch to production signing by setting the repository variable
  # SIGNPATH_SIGNING_POLICY_SLUG to 'release-signing' (no workflow edit required).
  SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}

jobs:

#===============================================================
# Stage 0: Delete Caches
#===============================================================

  delete-caches:
    name: Delete caches
    runs-on: ubuntu-slim # https://github.com/actions/runner-images/blob/main/images/ubuntu-slim/ubuntu-slim-Readme.md
    if: github.event_name == 'workflow_dispatch' && inputs.rebuild_caches == true
    # 'actions: write' permission is required to clear caches
    permissions:
      actions: write

    steps:
      - name: Delete cached dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          gh api --paginate --jq '
            .actions_caches[]
            | select(
                .key | startswith("llvm-")
                or startswith("qt6-")
              )
            | .id
          ' "repos/$GH_REPO/actions/caches" |
          while read -r cache_id; do
            echo "Deleting cache $cache_id"
            gh api --method DELETE "repos/$GH_REPO/actions/caches/$cache_id"
          done

#===============================================================
# Stage 1: LLVM
#===============================================================

  build-llvm:
    name: LLVM (${{ matrix.os }})
    runs-on: ${{ matrix.os }} # https://github.com/actions/runner-images#available-images
    needs:
      - 'delete-caches'
    if: ${{ !cancelled() && (needs.delete-caches.result == 'success' || needs.delete-caches.result == 'skipped') }}

#------------------------------------- Job matrix for LLVM

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cpu: intel
            archive_format: tar.gz
            llvm_version: 21.1.6
          - os: ubuntu-22.04-arm
            cpu: arm
            archive_format: tar.gz
            llvm_version: 21.1.6
          - os: windows-2025
            cpu: intel
            archive_format: zip
            llvm_version: 23.1.4
          - os: macos-15 # why does webpage claim compatibility down to macOS 13 when all deps & Doxygen itself are build with macOS 15? https://www.doxygen.nl/download.html
            cpu: arm
            archive_format: tar.gz
            llvm_version: 23.1.4
          - os: macos-15-intel # why does webpage claim compatibility down to macOS 13 when all deps & Doxygen itself are build with macOS 15? https://www.doxygen.nl/download.html
            cpu: intel
            archive_format: tar.gz
            llvm_version: 23.1.4

#------------------------------------- Job steps for LLVM

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

#------------------------------------- Setup Linux environment for LLVM

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          zlib1g-dev \
          libedit-dev \
          libffi-dev \
          libxml2-dev \
          libtinfo-dev

#------------------------------------- Setup Windows environment for LLVM

    - name: Set up MSVC dev command prompt (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

#------------------------------------- Restore LLVM installation output, or download source to build LLVM
        
    - name: Cache LLVM installation
      id: cache-llvm-install
      uses: actions/cache@v4
      with:
        path: llvm-install
        key: llvm-install-${{ matrix.llvm_version }}-${{ matrix.os }}

    - name: Download LLVM source code
      if: steps.cache-llvm-install.outputs.cache-hit != 'true'
      shell: bash
      run: |
        echo "Downloading LLVM ${{ matrix.llvm_version }}..."
        git clone --depth 1 --filter=blob:none --sparse --no-tags --branch llvmorg-${{ matrix.llvm_version }} https://github.com/llvm/llvm-project.git
        cd llvm-project
        git sparse-checkout set llvm
        echo "Sparse checkout of llvm folder completed successfully"

#------------------------------------- Configure LLVM build system for Linux/macOS + compile

    - name: Configure LLVM build (Linux/macOS)
      if: steps.cache-llvm-install.outputs.cache-hit != 'true' && runner.os != 'Windows'
      shell: bash
      run: |
        cmake -S llvm-project/llvm -B llvm-project/build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DLLVM_ENABLE_PROJECTS="clang;lld" \
          -DLLVM_ENABLE_OCAMLDOC=OFF \
          -DLLVM_ENABLE_LTO=OFF \
          -DLLVM_ENABLE_WARNINGS=OFF \
          -DLLVM_ENABLE_Z3_SOLVER=OFF \
          -DLLVM_ENABLE_ZSTD=OFF \
          -DLLVM_ENABLE_BINDING=OFF \
          -DLLVM_ENABLE_LIBXML2=OFF \
          -DLLVM_ENABLE_LIBEDIT=OFF \
          -DLLVM_ENABLE_ASSERTIONS=OFF \
          -DLLVM_INCLUDE_BENCHMARKS=OFF \
          -DLLVM_INCLUDE_TESTS=OFF \
          -DLLVM_INCLUDE_EXAMPLES=OFF \
          -DLLVM_TOOL_REMARKS_SHLIB_BUILD=OFF \
          -DLLVM_PARALLEL_LINK_JOBS=1 \
          -DLLVM_LINK_LLVM_DYLIB=OFF \
          -DLIBCLANG_BUILD_STATIC=ON \
          -DCLANG_LINK_CLANG_DYLIB=OFF \

    - name: Build & install LLVM (Linux/macOS)
      if: steps.cache-llvm-install.outputs.cache-hit != 'true' && runner.os != 'Windows'
      shell: bash
      run: |
          cd llvm-project/build
          cmake --build . --parallel
          cmake --install . --prefix llvm-install

#------------------------------------- Configure LLVM build system for Windows + compile

    - name: Configure LLVM build (Windows)
      if: steps.cache-llvm-install.outputs.cache-hit != 'true' && runner.os == 'Windows'
      shell: bash
      run: |
        cmake -S llvm-project/llvm -B llvm-project/build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DLLVM_ENABLE_PROJECTS="clang;lld" \
          -DLIBCLANG_BUILD_STATIC=ON \
          -DLLVM_ENABLE_OCAMLDOC=OFF \
          -DLLVM_ENABLE_LTO=OFF \
          -DLLVM_ENABLE_WARNINGS=OFF \
          -DLLVM_ENABLE_Z3_SOLVER=OFF \
          -DLLVM_ENABLE_ZSTD=OFF \
          -DLLVM_ENABLE_ZLIB=OFF \
          -DLLVM_ENABLE_BINDING=OFF \
          -DLLVM_ENABLE_LIBXML2=OFF \
          -DLLVM_ENABLE_LIBEDIT=OFF \
          -DLLVM_ENABLE_ASSERTIONS=OFF \
          -DLLVM_INCLUDE_BENCHMARKS=OFF \
          -DLLVM_INCLUDE_TESTS=OFF \
          -DLLVM_INCLUDE_EXAMPLES=OFF \
          -DLLVM_TOOL_REMARKS_SHLIB_BUILD=OFF \
          -DLLVM_PARALLEL_LINK_JOBS=1 \
          -DLLVM_USE_CRT_RELEASE=MT \
          -DLLVM_TARGETS_TO_BUILD="X86;AArch64" \
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

    - name: Build & install LLVM (Windows)
      if: steps.cache-llvm-install.outputs.cache-hit != 'true' && runner.os == 'Windows'
      shell: bash
      run: |
        cd llvm-project/build
        cmake --build . --parallel
        cmake --install . --prefix llvm-install

#------------------------------------- Check LLVM build results and installation output

    - name: Verify static build
      shell: bash
      run: |
        echo "Checking libclang static libraries..."
        if [ "${{ runner.os }}" == "Windows" ]; then
          win_search_dir="${{ github.workspace }}/llvm-install"
          win_search_dir="${win_search_dir//\\//}"
          find $win_search_dir -name "libclang*.lib" -o -name "clang*.lib" | head -10
        else
          find ${{ github.workspace }}/llvm-install -name "libclang*.a" | head -10
        fi

#------------------------------------- Create LLVM artifacts to upload

    - name: Create build artifact (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: tar -czf llvm-static-${{ matrix.llvm_version }}-${{ matrix.os }}.tar.gz -C llvm-install .

    - name: Create build artifact (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: Compress-Archive -Path 'llvm-install\\*' -DestinationPath 'llvm-static-${{ matrix.llvm_version }}-${{ matrix.os }}.zip' -Force

#------------------------------------- Upload LLVM artifacts

    - name: Upload LLVM static build
      uses: actions/upload-artifact@v6
      with:
        name: llvm-static-${{ matrix.llvm_version }}-${{ matrix.os }}
        path: llvm-static-${{ matrix.llvm_version }}-${{ matrix.os }}.${{ matrix.archive_format }}
        retention-days: 30

#===============================================================
# Stage 1: Xapian
#===============================================================

  build-xapian:
    name: Xapian (${{ matrix.os }})
    runs-on: ${{ matrix.os }} # https://github.com/actions/runner-images#available-images
    needs:
      - 'delete-caches'
    if: ${{ !cancelled() && (needs.delete-caches.result == 'success' || needs.delete-caches.result == 'skipped') }}

#------------------------------------- Job matrix for Xapian

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cpu: intel
            archive_format: tar.gz
          - os: ubuntu-22.04-arm
            cpu: arm
            archive_format: tar.gz
          - os: windows-2025
            cpu: intel
            archive_format: zip
          - os: macos-15
            cpu: arm
            archive_format: tar.gz
          - os: macos-15-intel
            cpu: intel
            archive_format: tar.gz

#------------------------------------- Job steps for Xapian

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

#------------------------------------- Setup Linux environment for Xapian

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          zlib1g-dev \
          uuid-dev
      shell: bash

#------------------------------------- Setup Windows environment for Xapian

    - name: Set up MSVC dev command prompt (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Download zlib (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        echo "Downloading zlib $ZLIB_VERSION..."
        curl -fL --retry 3 --progress-bar -o zlib.tgz "https://zlib.net/zlib-$ZLIB_VERSION.tar.gz"
        tar -xzf zlib.tgz

    - name: Build zlib (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        cd "zlib-$ZLIB_VERSION"
        # nmake -f win32/Makefile.msc LOC="-MT" all
        nmake -f win32/Makefile.msc LOC="-MT" zlib.lib

    - name: Install MSYS2 (Windows)
      uses: msys2/setup-msys2@v2
      if: runner.os == 'Windows'
      with:
        cache: false
        install: |
          autoconf
          automake
          libtool
          make

#------------------------------------- Setup macOS environment for Xapian

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install autoconf automake libtool libmagic

#------------------------------------- Download source to build Xapian

    - name: Download Xapian source code
      shell: bash
      run: |
        VERSION=$XAPIAN_VERSION
        ARCHIVE="xapian-core-$VERSION.tar.xz"
        echo "Downloading Xapian $VERSION..."
        mkdir xapian
        cd xapian
        curl -fL --retry 3 --progress-bar -o "$ARCHIVE" "https://oligarchy.co.uk/xapian/$VERSION/$ARCHIVE"
        tar -Jxf "$ARCHIVE"
        rm "$ARCHIVE"

#------------------------------------- Configure Xapian build for Linux/macOS + compile

    - name: Configure Xapian (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        cd xapian/xapian-core-$XAPIAN_VERSION
        ./configure \
          --prefix=${{ github.workspace }}/xapian-install \
          --enable-static=yes \
          --enable-shared=no \
          --disable-documentation

    - name: Build & install Xapian (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        cd xapian/xapian-core-$XAPIAN_VERSION
        make
        make install

#------------------------------------- Configure Xapian build for Windows + compile

    - name: Write configuration script for Xapian (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        cd "xapian/xapian-core-$XAPIAN_VERSION"

        cat <<-'EOF' > run_me.sh
        export CC="cl -nologo"
        export CXX="./compile cl -nologo"
        export CXXFLAGS="-EHsc"
        export AR="lib"
        export LD="link"
        export NM="dumpbin"
        export CPPFLAGS="-I../../zlib-$ZLIB_VERSION"
        export LDFLAGS="-I../../zlib-$ZLIB_VERSION"

        echo "=== Environment inside run_me.sh ==="
        printf 'PREFIX_UNIX=<%s>\n' "$PREFIX_UNIX"
        type -a cl link lib dumpbin || true

        ./configure \
          --enable-static=yes \
          --enable-shared=no \
          --prefix="$PREFIX_UNIX"
        EOF

        chmod 755 run_me.sh
        echo "==== run_me.sh ===="
        cat run_me.sh
        echo "===="

    - name: Configure Xapian (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        cd "xapian/xapian-core-$XAPIAN_VERSION"
        export PATH="/c/msys64/usr/bin:$PATH"
        export LIB="$(cygpath -w "$PWD/../../zlib-$ZLIB_VERSION")${LIB:+;$LIB}"
        export PREFIX="$(cygpath -w "$GITHUB_WORKSPACE/xapian-install")"
        export MSYS2_PATH_TYPE=inherit
        export PREFIX_UNIX="$(cygpath -u "$PREFIX")"

        # Put MSVC tools ahead of MSYS2/Git for the configure step.
        MSVC_BIN="$(dirname "$(command -v cl)")"
        export PATH="$MSVC_BIN:$PATH"

        echo "=== Compiler and linker resolution ==="
        type -a cl link lib dumpbin cygpath || true
        printf 'cl=<%s>\nlink=<%s>\nlib=<%s>\ndumpbin=<%s>\n' \
          "$(command -v cl)" "$(command -v link)" \
          "$(command -v lib)" "$(command -v dumpbin)"

        echo "=== Prefix conversion ==="
        printf 'PREFIX=<%s>\nPREFIX_UNIX=<%s>\n' "$PREFIX" "$PREFIX_UNIX"
        cygpath -w "$PREFIX_UNIX"

        if bash ./run_me.sh; then
          :
        else
          status=$?
          echo "=== Xapian config.log (last 120 lines) ==="
          tail -n 120 config.log || true
          echo "=== C compiler test commands and errors ==="
          grep -n -A20 -B10 -E 'conftest|cannot compute|link|cl.exe|error' config.log | tail -n 200 || true
          exit "$status"
        fi

    - name: Build & install Xapian (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        cd xapian/xapian-core-$XAPIAN_VERSION
        make
        make install

#------------------------------------- Verify Xapian build results and installation output

    - name: Verify static build
      shell: bash
      run: |
        echo "Checking Xapian static library..."
        cd xapian
        if [ "${{ runner.os }}" == "Windows" ]; then
          find "$(cygpath "${{ github.workspace }}")/xapian-install" -name "*.lib" | head -10
        else
          find ${{ github.workspace }}/xapian-install -name "*.a" | head -10
          nm -C ${{ github.workspace }}/xapian-install/lib/libxapian.a  | grep " U " | sort | uniq
        fi

#------------------------------------- Create Xapian build artifacts to upload

    - name: Create build artifact (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: tar -czf xapian-static-${{ env.XAPIAN_VERSION }}-${{ matrix.os }}.tar.gz -C xapian-install .

    - name: Create build artifact (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: Compress-Archive -Path 'xapian-install\\*' -DestinationPath 'xapian-static-${{ env.XAPIAN_VERSION }}-${{ matrix.os }}.zip' -Force

#------------------------------------- Upload Xapian build artifacts

    - name: Upload Xapian static build
      uses: actions/upload-artifact@v6
      with:
        name: xapian-static-${{ env.XAPIAN_VERSION }}-${{ matrix.os }}
        path: xapian-static-${{ env.XAPIAN_VERSION }}-${{ matrix.os }}.${{ matrix.archive_format }}
        retention-days: 30

#===============================================================
# Stage 1: Qt6
#===============================================================

  build-qt6:
    name: Qt6 (${{ matrix.os }})
    runs-on: ${{ matrix.os }} # https://github.com/actions/runner-images#available-images
    needs:
      - 'delete-caches'
    if: ${{ !cancelled() && (needs.delete-caches.result == 'success' || needs.delete-caches.result == 'skipped') }}

#------------------------------------- Job matrix for Qt6

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cpu: intel
            archive_format: tar.gz
          - os: ubuntu-22.04-arm
            cpu: arm
            archive_format: tar.gz
          - os: windows-2025
            cpu: intel
            archive_format: zip
          - os: macos-15
            cpu: arm
            archive_format: tar.gz
          - os: macos-15-intel
            cpu: intel
            archive_format: tar.gz

#------------------------------------- Job steps for Qt6

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

#------------------------------------- Setup Linux environment for Qt6

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libfontconfig1-dev \
          libfreetype6-dev \
          libx11-dev \
          libx11-xcb-dev \
          libxext-dev \
          libxfixes-dev \
          libxi-dev \
          libxrender-dev \
          libxcb1-dev \
          libxcb-cursor-dev \
          libxcb-glx0-dev \
          libxcb-keysyms1-dev \
          libxcb-image0-dev \
          libxcb-shm0-dev \
          libxcb-icccm4-dev \
          libxcb-sync-dev \
          libxcb-xfixes0-dev \
          libxcb-shape0-dev \
          libxcb-randr0-dev \
          libxcb-render-util0-dev \
          libxcb-util-dev \
          libxcb-xinerama0-dev \
          libxcb-xkb-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          libgl1-mesa-dev \
          libglu1-mesa-dev

#------------------------------------- Setup Windows environment for Qt6

    - name: Set up MSVC dev command prompt (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

#------------------------------------- Restore Qt6 installation output, or download source to build Qt6

    - name: Cache Qt6 install
      id: cache-qt6-install
      uses: actions/cache@v4
      with:
        path: qt6-install
        key: qt6-install-${{ env.QT6_VERSION }}-${{ matrix.os }}

    - name: Download Qt6 source code
      if: steps.cache-qt6-install.outputs.cache-hit != 'true'
      shell: bash
      run: |
        VERSION="$QT6_VERSION"
        MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1-2)
        BASE_URL="https://download.qt.io/official_releases/qt/$MAJOR_MINOR/$VERSION/submodules"
        echo "Downloading Qt6 $VERSION..."
        mkdir -p qt6-source
        cd qt6-source

        echo "Downloading qtbase module..."
        curl -fL --retry 3 --progress-bar -o qtbase.tar.xz "$BASE_URL/qtbase-everywhere-src-$VERSION.tar.xz"
        tar -xf qtbase.tar.xz
        mv qtbase-everywhere-src-$VERSION qtbase
        rm qtbase.tar.xz

        echo "Downloading qtsvg module..."
        curl -fL --retry 3 --progress-bar -o qtsvg.tar.xz "$BASE_URL/qtsvg-everywhere-src-$VERSION.tar.xz"
        tar -xf qtsvg.tar.xz
        mv qtsvg-everywhere-src-$VERSION qtsvg
        rm qtsvg.tar.xz

        echo "Downloading qttranslations module..."
        curl -fL --retry 3 --progress-bar -o qttranslations.tar.xz "$BASE_URL/qttranslations-everywhere-src-$VERSION.tar.xz"
        tar -xf qttranslations.tar.xz
        mv qttranslations-everywhere-src-$VERSION qttranslations
        rm qttranslations.tar.xz

        echo "Downloading qttools module..."
        curl -fL --retry 3 --progress-bar -o qttools.tar.xz "$BASE_URL/qttools-everywhere-src-$VERSION.tar.xz"
        tar -xf qttools.tar.xz
        mv qttools-everywhere-src-$VERSION qttools
        rm qttools.tar.xz

        if [ ! -d "qtbase" ] || [ ! -d "qtsvg" ] || [ ! -d "qttranslations" ] || [ ! -d "qttools" ]; then
          echo "Error: Qt6 source download failed or directory structure is incorrect"
          exit 1
        fi
        echo "Qt6 source downloaded successfully"

#------------------------------------- Configure Qt6 build system for Linux/macOS + compile

    - name: Configure CMake for Qt6 Base (Linux)
      if: steps.cache-qt6-install.outputs.cache-hit != 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        cd qt6-source/qtbase
        ./configure -static -static-runtime -release -prefix ${{ github.workspace }}/qt6-install -platform linux-g++-64 -qt-zlib -qt-pcre -qt-libpng -qt-libjpeg -qt-freetype -opengl desktop -sql-sqlite -no-openssl -opensource -confirm-license -make libs -nomake tools -nomake tests
        cmake --build . --parallel
        cmake --install .

    - name: Configure CMake for Qt6 Base (macOS)
      if: steps.cache-qt6-install.outputs.cache-hit != 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        cd qt6-source/qtbase
        ./configure -static -static-runtime -release -prefix ${{ github.workspace }}/qt6-install -platform macx-clang -qt-zlib -qt-pcre -qt-libpng -qt-libjpeg -qt-freetype -opengl desktop -sql-sqlite -no-openssl -opensource -confirm-license -make libs -nomake tools -nomake tests
        cmake --build . --parallel
        cmake --install .

    - name: Configure CMake for Qt6 tools (Linux/macOS)
      if: steps.cache-qt6-install.outputs.cache-hit != 'true' && runner.os != 'Windows'
      shell: bash
      run: |
        cd qt6-source/qttools
        ${{ github.workspace }}/qt6-install/bin/qt-configure-module .
        cmake --build . --parallel
        cmake --install .

    - name: Configure CMake for Qt6 SVG (Linux/macOS)
      if: steps.cache-qt6-install.outputs.cache-hit != 'true' && runner.os!= 'Windows'
      shell: bash
      run: |
        cd qt6-source/qtsvg
        ${{ github.workspace }}/qt6-install/bin/qt-configure-module .
        cmake --build . --parallel
        cmake --install .

    - name: Configure CMake for Qt6 translations (Linux/macOS)
      if: steps.cache-qt6-install.outputs.cache-hit != 'true' && runner.os != 'Windows'
      shell: bash
      run: |
        cd qt6-source/qttranslations
        ${{ github.workspace }}/qt6-install/bin/qt-configure-module .
        cmake --build . --parallel
        cmake --install .

#------------------------------------- Configure Qt6 build system for Windows + compile

    - name: Configure CMake for Qt6 Base (Windows)
      if: steps.cache-qt6-install.outputs.cache-hit != 'true' && runner.os == 'Windows'
      shell: bash
      run: |
        cd qt6-source/qtbase
        call configure.bat -static -static-runtime -release -prefix ${{ github.workspace }}/qt6-install -platform win32-msvc -qt-zlib -qt-pcre -qt-libpng -qt-libjpeg -qt-freetype -opengl desktop -sql-sqlite -sql-odbc -no-openssl -opensource -confirm-license -make libs -nomake tools -nomake tests
        cmake --build . --parallel
        cmake --install .

    - name: Configure CMake for Qt6 tools (Windows)
      if: steps.cache-qt6-install.outputs.cache-hit != 'true' && runner.os == 'Windows'
      shell: bash
      run: |
        cd qt6-source/qttools
        call ${{ github.workspace }}/qt6-install/bin/qt-configure-module.bat .
        cmake --build . --parallel
        cmake --install .

    - name: Configure CMake for Qt6 SVG (Windows)
      if: steps.cache-qt6-install.outputs.cache-hit != 'true' && runner.os == 'Windows'
      shell: bash
      run: |
        cd qt6-source/qtsvg
        call ${{ github.workspace }}/qt6-install/bin/qt-configure-module.bat .
        cmake --build . --parallel
        cmake --install .

    - name: Configure CMake for Qt6 translations (Windows)
      if: steps.cache-qt6-install.outputs.cache-hit != 'true' && runner.os == 'Windows'
      shell: bash
      run: |
        cd qt6-source/qttranslations
        call ${{ github.workspace }}/qt6-install/bin/qt-configure-module.bat .
        cmake --build . --parallel
        cmake --install .

#------------------------------------- Verify Qt6 build results

    - name: Verify static build
      run: |
        echo "Checking Qt6 static libraries..."
        if [ "${{ runner.os }}" == "Windows" ]; then
          win_search_dir="${{ github.workspace }}/qt6-install"
          win_search_dir="${win_search_dir//\\//}"
          find $win_search_dir -name "Qt6*.lib" | head -10
        else
          find ${{ github.workspace }}/qt6-install -name "libQt6*.a" | head -10
        fi
      shell: bash

#------------------------------------- Create Qt6 build artifacts to upload

    - name: Create build artifact (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: tar -czf qt6-static-${{ env.QT6_VERSION }}-${{ matrix.os }}.tar.gz -C qt6-install .

    - name: Create build artifact (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: Compress-Archive -Path 'qt6-install\\*' -DestinationPath 'qt6-static-${{ env.QT6_VERSION }}-${{ matrix.os }}.zip' -Force

#------------------------------------- Upload the Qt6 build artifacts

    - name: Upload Qt6 static build
      uses: actions/upload-artifact@v6
      with:
        name: qt6-static-${{ env.QT6_VERSION }}-${{ matrix.os }}
        path: qt6-static-${{ env.QT6_VERSION }}-${{ matrix.os }}.${{ matrix.archive_format }}
        retention-days: 30

#===============================================================
# Stage 2: Doxygen
#===============================================================

  build-doxygen:
    name: Doxygen (${{ matrix.os }})
    runs-on: ${{ matrix.os }} # https://github.com/actions/runner-images#available-images
    needs:
      - 'build-llvm'
      - 'build-xapian'
      - 'build-qt6'
    if: ${{ !cancelled() && needs.build-llvm.result == 'success' && needs.build-xapian.result == 'success' && needs.build-qt6.result == 'success' }}

    # 'actions: read' is required by the SignPath GitHub Action to download the
    # unsigned artifact that gets submitted for code signing (Windows only).
    permissions:
      contents: read
      actions: read

#------------------------------------- Job matrix for Doxygen

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cpu: intel
            extension: ""
            llvm_version: 21.1.6
          - os: ubuntu-22.04-arm
            cpu: arm
            extension: ""
            llvm_version: 21.1.6
          - os: windows-2025
            cpu: intel
            extension: .exe
            llvm_version: 23.1.4
          - os: macos-15
            cpu: arm
            extension: ""
            llvm_version: 23.1.4
          - os: macos-15-intel
            cpu: intel
            extension: ""
            llvm_version: 23.1.4

#------------------------------------- Job steps for Doxygen

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

#------------------------------------- Setup Linux environment for Doxygen

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          zlib1g-dev \
          libedit-dev \
          libffi-dev \
          libxml2-dev \
          libtinfo-dev \
          libfontconfig1-dev \
          libfreetype6-dev \
          libx11-dev \
          libx11-xcb-dev \
          libxext-dev \
          libxfixes-dev \
          libxi-dev \
          libxrender-dev \
          libxcb1-dev \
          libxcb-cursor-dev \
          libxcb-glx0-dev \
          libxcb-keysyms1-dev \
          libxcb-image0-dev \
          libxcb-shm0-dev \
          libxcb-icccm4-dev \
          libxcb-sync-dev \
          libxcb-xfixes0-dev \
          libxcb-shape0-dev \
          libxcb-randr0-dev \
          libxcb-render-util0-dev \
          libxcb-util-dev \
          libxcb-xinerama0-dev \
          libxcb-xkb-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          uuid-dev \
          texlive \
          texlive-latex-recommended \
          texlive-extra-utils \
          texlive-latex-extra \
          texlive-font-utils \
          ghostscript \
          graphviz

#------------------------------------- Setup Windows environment for Doxygen

    - name: Set up MSVC dev command prompt (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: choco install winflexbison3 ghostscript graphviz.portable

    - name: Install MikTeX (Windows)
      if: runner.os == 'Windows'
      uses: nick-invision/retry@v4
      with:
        timeout_minutes: 15
        max_attempts: 5
        retry_wait_seconds: 60
        command: |
          choco install miktex --debug --verbose --no-progress --params "/Set:basic" -y
          if ($?) { echo "C:\Program Files\MiKTeX\miktex\bin\x64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 }

    - name: Configure MikTeX (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        miktex --admin --verbose packages update-package-database
        miktex --admin --verbose packages update
        miktex --admin --verbose fndb refresh
        initexmf --admin --verbose --set-config-value=[MPM]AutoInstall=1
        initexmf --admin --verbose --update-fndb
        initexmf --admin --verbose --mklinks --force
        updmap --admin

    - name: Setting Ghostscript paths (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        export GSpath=`find /c/Prog*/gs -name gswin\*c.exe | sed -e "s/gswin.*c.exe//"`
        export PATH="$GSpath:$PATH"
        export GSpath=`echo "$GSpath" | sed -e "s%/c%C:%"`
        echo "$GSpath" >> $GITHUB_PATH

    - name: Check tool versions (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        echo "=== perl ===";
        perl --version;
        echo "=== python ===";
        python --version;
        echo "=== cmake ===";
        cmake --version;
        echo "=== latex ===";
        latex --version;
        echo "=== bibtex ===";
        bibtex --version
        echo "=== dvips ===";
        dvips --version
        echo "=== bison ===";
        win_bison --version;
        echo "=== flex ===";
        win_flex --version;
        echo "=== dot ===";
        dot -V;
        echo "=== ghostscript ===";
        gswin64c --version;

#------------------------------------- Setup macOS environment for Doxygen

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install flex bison ossp-uuid
        # make sure flex and bison from brew are found and not the one from the system.
        echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
        echo "$(brew --prefix flex)/bin" >> $GITHUB_PATH
        echo "LOC=$(brew --prefix ossp-uuid)"

#------------------------------------- Install HtmlHelp compiler for Windows

    - name: Download htmlhelp (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # curl -fL --retry 3 --progress-bar -o windows/htmlhelp.exe http://web.archive.org/web/20160201063255/http://download.microsoft.com/download/0/A/9/0A939EF6-E31C-430F-A3DF-DFAE7960D564/htmlhelp.exe
        ./windows/htmlhelp.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART

    - name: Verify hhc.exe is installed
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
          $possiblePaths = @(
            "$env:ProgramFiles(x86)\HTML Help Workshop\hhc.exe",
            "$env:ProgramFiles\HTML Help Workshop\hhc.exe",
            "$env:ProgramFiles(x86)\HTMLHelpWorkshop\hhc.exe",
            "$env:ProgramFiles\HTMLHelpWorkshop\hhc.exe"
          )

          # Find first existing file
          $installed = $possiblePaths | Where-Object { Test-Path $_ } | Select-Object -First 1

          # Fallback: on PATH
          if (-not $installed) {
            $cmd = Get-Command hhc.exe -ErrorAction SilentlyContinue
            if ($cmd) { $installed = $cmd.Path }
          }

          if (-not $installed) {
            Write-Error "hhc.exe not found in known locations or PATH."
            exit 1
          }

          Write-Host "hhc.exe found at: $installed"
          $fi = Get-Item $installed
          Write-Host "FileVersion: $($fi.VersionInfo.FileVersion)"
          Write-Host "ProductVersion: $($fi.VersionInfo.ProductVersion)"

#------------------------------------- Download and install static libz for Windows

    - name: Download zlib (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        echo "Downloading zlib $ZLIB_VERSION..."
        curl -fL --retry 3 --progress-bar -o zlib.tgz "https://zlib.net/zlib-$ZLIB_VERSION.tar.gz"
        tar -xzf zlib.tgz

    - name: Build zlib (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        cd "zlib-$ZLIB_VERSION"
        # nmake -f win32/Makefile.msc LOC="-MT" all
        nmake -f win32/Makefile.msc LOC="-MT" zlib.lib

#------------------------------------- Determine version of Doxygen to use

    - name: Get latest Doxygen release tag
      id: doxygen-version
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        # Use latest tagged version
        if [ "${{ github.event.inputs.doxygen_source_version }}" == "tagged" ]; then # value is "tagged"
          set -euo pipefail
          resp=$(curl -sS -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/doxygen/doxygen/tags" ) || true
          tag=$(echo "$resp" | jq -r '.[0].name // empty')
          LATEST_TAG="$tag"

          if [ -z "${LATEST_TAG:-}" ]; then
            echo "Error: Could not fetch Doxygen release tag; last response:"
            echo "$resp" | jq -C '.' || echo "$resp"
            exit 1
          fi

          echo "Latest Doxygen tag: $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          # Remove leading 'Release_' prefix if present
          VERSION=${LATEST_TAG#Release_}
          VERSION=${VERSION//_/.}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

        else # value is "master"
          # Alternatively use latest master
          git clone --depth 1 --branch master https://github.com/doxygen/doxygen.git
          VERSION=`cat doxygen/VERSION`
          echo "tag=master" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        fi

#------------------------------------- Download source to build Doxygen

    - name: Download Doxygen source code
      shell: bash
      run: |
        echo "Downloading Doxygen ${{ steps.doxygen-version.outputs.tag }}..."

        if [ "${{ github.event.inputs.doxygen_source_version }}" == "tagged" ]; then # value is "tagged"
          # Download source for latest tagged release
          git clone --depth 1 --branch ${{ steps.doxygen-version.outputs.tag }} https://github.com/doxygen/doxygen.git
        else # value is "master"
          echo "Using latest master (${{ steps.doxygen-version.outputs.version }}), source is already downloaded in the previous step"
        fi

        if [ ! -d "doxygen" ]; then
          echo "Error: Doxygen source download failed or directory structure is incorrect"
          exit 1
        fi
        echo "Doxygen source downloaded successfully"

#------------------------------------- Prepare LLVM libclang dependency for Doxygen
#
    - name: Download LLVM artifacts
      uses: actions/download-artifact@v7
      with:
        name: llvm-static-${{ matrix.llvm_version }}-${{ matrix.os }}
        path: llvm-artifact

    - name: Extract LLVM artifacts (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        mkdir -p llvm-install
        ls llvm-artifact
        # Extract the tar.gz archive to the install directory
        tar -xzf llvm-artifact/llvm-static-${{ matrix.llvm_version }}-${{ matrix.os }}.tar.gz -C llvm-install
        ls llvm-install

    - name: Extract LLVM artifacts (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        mkdir llvm-install
        dir llvm-artifact
        Expand-Archive -Path "llvm-artifact/llvm-static-${{ matrix.llvm_version }}-${{ matrix.os }}.zip" -DestinationPath "llvm-install"
        dir llvm-install

#------------------------------------- Prepare Qt dependency for Doxygen

    - name: Download Qt6 artifacts
      uses: actions/download-artifact@v7
      with:
        name: qt6-static-${{ env.QT6_VERSION }}-${{ matrix.os }}
        path: qt6-artifact

    - name: Extract Qt6 artifacts (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        mkdir -p qt6-install
        ls qt6-artifact
        # Extract the tar.gz archive to the install directory
        tar -xzf qt6-artifact/qt6-static-${{ env.QT6_VERSION }}-${{ matrix.os }}.tar.gz -C qt6-install
        ls qt6-install

    - name: Extract Qt6 artifacts (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        mkdir qt6-install
        dir qt6-artifact
        Expand-Archive -Path "qt6-artifact/qt6-static-${{ env.QT6_VERSION }}-${{ matrix.os }}.zip" -DestinationPath "qt6-install"
        dir qt6-install

#------------------------------------- Prepare Xapian dependency for Doxygen

    - name: Download Xapian artifact
      uses: actions/download-artifact@v7
      with:
        name: xapian-static-${{ env.XAPIAN_VERSION }}-${{ matrix.os }}
        path: xapian-artifact

    - name: Extract Xapian artifacts (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        mkdir -p xapian-install
        ls xapian-artifact
        # Extract the tar.gz archive to the install directory
        tar -xzf xapian-artifact/xapian-static-${{ env.XAPIAN_VERSION }}-${{ matrix.os }}.tar.gz -C xapian-install
        ls xapian-install

    - name: Extract Xapian artifacts (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        mkdir xapian-install
        dir xapian-artifact
        Expand-Archive -Path "xapian-artifact/xapian-static-${{ env.XAPIAN_VERSION }}-${{ matrix.os }}.zip" -DestinationPath "xapian-install"
        dir xapian-install

#------------------------------------- Configure Doxygen build

    - name: Configure CMake for Doxygen (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        UUID_MULTIARCH="$(gcc -print-multiarch)"
        UUID_LIB="/usr/lib/${UUID_MULTIARCH}/libuuid.a"
        if [ ! -f "$UUID_LIB" ]; then
          echo "Error: static libuuid not found for ${UUID_MULTIARCH}: ${UUID_LIB}"
          exit 1
        fi
        UUID_FLAG="-DUUID_LIB=${UUID_LIB}"
        echo "Using libuuid: $UUID_LIB"
        echo "UUID_FLAG=$UUID_FLAG"

        cmake -S doxygen -B doxygen/build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}" \
          -DXAPIAN_LIBRARIES="${{ github.workspace }}/xapian-install/lib/libxapian.a" \
          -DXAPIAN_INCLUDE_DIR="${{ github.workspace }}/xapian-install/include" \
          $UUID_FLAG \
          -DLLVM_DIR="${{ github.workspace }}/llvm-install/lib/cmake/llvm" \
          -DClang_DIR="${{ github.workspace }}/llvm-install/lib/cmake/clang" \
          -DQt6_DIR="${{ github.workspace }}/qt6-install/lib/cmake/Qt6" \
          -DQt6Core_DIR="${{ github.workspace }}/qt6-install/lib/cmake/Qt6Core" \
          -DQt6Gui_DIR="${{ github.workspace }}/qt6-install/lib/cmake/Qt6Gui" \
          -DQt6Widgets_DIR="${{ github.workspace }}/qt6-install/lib/cmake/Qt6Widgets" \
          -Dbuild_doc=YES \
          -Dbuild_search=YES \
          -Dbuild_wizard=YES \
          -Duse_libclang=YES \
          -Dstatic_libclang=YES \
          -Dstatic_libxapian=YES \
          -Dforce_qt=Qt6 \
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/llvm-install;${{ github.workspace }}/qt6-install;${{ github.workspace }}/xapian-install"

    - name: Configure CMake for Doxygen (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        UUID_FLAG="-DUUID_LIB=$(brew --prefix ossp-uuid)/lib/libuuid.a"
        echo "UUID_FLAG=$UUID_FLAG"

        cmake -S doxygen -B doxygen/build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}" \
          -DXAPIAN_LIBRARIES="${{ github.workspace }}/xapian-install/lib/libxapian.a" \
          -DXAPIAN_INCLUDE_DIR="${{ github.workspace }}/xapian-install/include" \
          $UUID_FLAG \
          -DLLVM_DIR="${{ github.workspace }}/llvm-install/lib/cmake/llvm" \
          -DClang_DIR="${{ github.workspace }}/llvm-install/lib/cmake/clang" \
          -DQt6_DIR="${{ github.workspace }}/qt6-install/lib/cmake/Qt6" \
          -DQt6Core_DIR="${{ github.workspace }}/qt6-install/lib/cmake/Qt6Core" \
          -DQt6Gui_DIR="${{ github.workspace }}/qt6-install/lib/cmake/Qt6Gui" \
          -DQt6Widgets_DIR="${{ github.workspace }}/qt6-install/lib/cmake/Qt6Widgets" \
          -Dbuild_search=YES \
          -Dbuild_wizard=YES \
          -Duse_libclang=YES \
          -Dstatic_libclang=YES \
          -Dstatic_libxapian=YES \
          -Dforce_qt=Qt6 \
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/llvm-install;${{ github.workspace }}/qt6-install;${{ github.workspace }}/xapian-install"

    - name: Configure CMake for Doxygen (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        cmake -S doxygen -B doxygen/build \
          -G Ninja \
          -Dwin_static=YES \
          -Dbuild_search=YES \
          -Dbuild_wizard=YES \
          -Duse_libclang=YES \
          -Dstatic_libclang=YES \
          -Dforce_qt=Qt6 \
          -Dbuild_doc=YES \
          -Dbuild_doc_chm=YES \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DXAPIAN_LIBRARIES=${{ github.workspace }}/xapian-install/lib/xapian.lib \
          -DXAPIAN_INCLUDE_DIR=${{ github.workspace }}/xapian-install/include \
          -DLLVM_DIR=${{ github.workspace }}/llvm-install/lib/cmake/llvm \
          -DClang_DIR=${{ github.workspace }}/llvm-install/lib/cmake/clang \
          -DCLANG_LIBS=${{ github.workspace }}/llvm-install/lib/libclang.lib \
          -DQt6_DIR=${{ github.workspace }}/qt6-install/lib/cmake/Qt6 \
          -DQt6Core_DIR=${{ github.workspace }}/qt6-install/lib/cmake/Qt6Core \
          -DQt6Gui_DIR=${{ github.workspace }}/qt6-install/lib/cmake/Qt6Gui \
          -DQt6Widgets_DIR=${{ github.workspace }}/qt6-install/lib/cmake/Qt6Widgets \
          -DZLIB_LIBRARY=${{ github.workspace }}/zlib-${{ env.ZLIB_VERSION }}/zlib.lib \
          -DZLIB_INCLUDE_DIR=${{ github.workspace }}/zlib-${{ env.ZLIB_VERSION }}/include

#------------------------------------- Build Doxygen targets + install

    - name: Build Doxygen (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        cd doxygen/build
        cmake --build . --parallel

    - name: Build Doxygen docs (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        cd doxygen/build
        cmake --build . --parallel 2 --target docs
        cmake --build . --parallel 2 --target docs_chm    # do they run in parallel or can the core limitation be removed?

    - name: Install Doxygen (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        cd doxygen/build
        cmake --install . --path doxygen-install

    - name: Build Doxygen (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        cd doxygen/build
        cmake --build . --parallel

    - name: Install Doxygen (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        cd doxygen/build
        cmake --install . --path doxygen-install

    - name: Build Doxygen (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        cd doxygen/build
        cmake --build . --parallel

    - name: Build Doxygen docs (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        cd doxygen/build
        cmake --build . --parallel 2 --target docs
        cmake --build . --parallel 2 --target docs_chm    # will they run in parallel to each other? otherwise no reason to reduce to npocmax/2 for each?

    - name: Install Doxygen (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        cd doxygen/build
        cmake --install . --path doxygen-install

#------------------------------------- Verify Doxygen build results

    - name: Verify Doxygen build (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo "Checking Doxygen binary..."
        ls -lh ${{ github.workspace }}/doxygen-install/bin/doxygen${{ matrix.extension }}
        # Try to run Doxygen to verify it works
        ${{ github.workspace }}/doxygen-install/bin/doxygen${{ matrix.extension }} --version || echo "Note: Doxygen version check failed"

    - name: Verify Doxygen build (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        echo "Checking Doxygen binary..."
        DOXYGEN_PATH="${{ github.workspace }}/doxygen-install/bin/doxygen${{ matrix.extension }}"
        ls -lh $DOXYGEN_PATH
        $DOXYGEN_PATH --version || echo "Note: doxygen version check failed"

#------------------------------------- Create Doxygen installation artifacts for Windows

    - name: Prepare Doxygen executables (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        subst R: ${{ github.workspace }}
        mkdir installer
        copy R:\llvm-install\bin\libclang.dll ${{ github.workspace }}\doxygen-install\bin
        editbin R:\doxygen-install\bin\doxygen.exe /SUBSYSTEM:CONSOLE,6.00 /OSVERSION:5.1
        editbin R:\doxygen-install\bin\doxyindexer.exe /SUBSYSTEM:CONSOLE,6.00 /OSVERSION:5.1
        editbin R:\doxygen-install\bin\doxysearch.cgi.exe /SUBSYSTEM:CONSOLE,6.00 /OSVERSION:5.1

#------------------------------------- Sign the Doxygen executables via SignPath for Windows

# The executables are code signed before they are packaged into the installer
# and the zip archive, so both contain signed binaries. SignPath is configured
# to use the self-signed test certificate by default (SIGNPATH_SIGNING_POLICY_SLUG
# defaults to 'test-signing'); once SignPath has imported the production
# certificate, switch to it by setting the repository variable
# SIGNPATH_SIGNING_POLICY_SLUG to 'release-signing', no workflow change required.

    - name: Upload unsigned executables (Windows)
      if: runner.os == 'Windows'
      id: upload-unsigned-executables
      uses: actions/upload-artifact@v6
      with:
        name: doxygen-${{ steps.doxygen-version.outputs.version }}-windows-unsigned-executables
        path: |
          doxygen-install/bin/doxygen.exe
          doxygen-install/bin/doxyindexer.exe
          doxygen-install/bin/doxysearch.cgi.exe
          doxygen-install/bin/doxywizard.exe
        retention-days: 1

    - name: Submit executables for signing (Windows)
      if: runner.os == 'Windows' && github.repository == 'doxygen/doxygen-release' # Do not run signing step on forks
      id: sign-executables
      uses: signpath/github-action-submit-signing-request@v1
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
        project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
        artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIGURATION_BINARIES_SLUG }}
        signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
        github-artifact-id: ${{ steps.upload-unsigned-executables.outputs.artifact-id }}
        wait-for-completion: true
        output-artifact-directory: signed/executables

    - name: Replace executables with signed ones (Windows)
      if: runner.os == 'Windows' && github.repository == 'doxygen/doxygen-release' # Do not run signing step on forks
      shell: pwsh
      run: Copy-Item -Path 'signed\executables\*' -Destination 'doxygen-install\bin' -Force

    - name: Create Doxygen installer (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $VERSION = "${{ steps.doxygen-version.outputs.version }}"
        Write-Host "Using version: '$VERSION'"
        (Get-Content .\windows\doxygen.iss -Raw) -replace '\$VERSION','$VERSION' | Set-Content -Encoding ASCII .\doxygen-versioned.iss
        # Invoke the inno setup compiler
        $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
        if (-not $iscc) {
          Write-Error "ISCC.exe not found. Checked: $($possible -join '; ') and PATH."
          exit 1
        }
        & iscc 'doxygen-versioned.iss'
        if ($LASTEXITCODE -ne 0) { Write-Error "ISCC failed with exit code $LASTEXITCODE"; exit $LASTEXITCODE }
        $doxygen_chm_files = @(
          'R:\doxygen-install\share\doc\packages\doxygen\doxygen_manual.chm'
        )
        Compress-Archive -Path $doxygen_chm_files -DestinationPath 'R:\installer\doxygen_manual-$VERSION.chm.zip' -Force
        $doxygen_zip_files = @(
          'R:\doxygen-install\bin\doxysearch.cgi.exe',
          'R:\doxygen-install\bin\doxyindexer.exe',
          'R:\doxygen-install\bin\doxywizard.exe'
          'R:\doxygen-install\bin\doxygen.exe'
          'R:\doxygen-install\bin\libclang.dll'
        )
        Compress-Archive -Path $doxygen_zip_files -DestinationPath 'R:\installer\doxygen-$VERSION.windows.x64.bin.zip' -Force

    - name: Upload unsigned installer (Windows)
      if: runner.os == 'Windows'
      id: upload-unsigned-installer
      uses: actions/upload-artifact@v6
      with:
        name: doxygen-$VERSION-windows-unsigned-installer
        path: installer/doxygen-$VERSION-setup.exe
        retention-days: 1

    - name: Submit installer for signing (Windows)
      if: runner.os == 'Windows' && github.repository == 'doxygen/doxygen-release' # Do not run signing step on forks
      id: sign-installer
      uses: signpath/github-action-submit-signing-request@v1
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
        project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
        artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIGURATION_INSTALLER_SLUG }}
        signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
        github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
        wait-for-completion: true
        output-artifact-directory: signed/installer

    - name: Replace installer with signed one (Windows)
      if: runner.os == 'Windows' && github.repository == 'doxygen/doxygen-release' # Do not run signing step on forks
      shell: pwsh
      run: Copy-Item -Path 'signed\installer\doxygen-$VERSION-setup.exe' -Destination 'installer\doxygen-$VERSION-setup.exe' -Force

#------------------------------------- Create Doxygen installation artifacts for macOS (1/2)

    - name: Create Doxygen installer 1/2 (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        mkdir installer
        # Create DMG file
        mkdir image
        bunzip2 -k macos/template.sparseimage.bz2
        hdiutil attach macos/template.sparseimage -noautoopen -quiet -mountpoint image
        cp -a macos/Doxygen.app image
        # cp -a macos/Readme.rtf image
        mkdir -p image/Doxygen.app/Contents/MacOS
        sed -i -e "s/\$VERSION/${{ steps.doxygen-version.outputs.version }}/g" image/Doxygen.app/Contents/Info.plist
        cp doxygen/build/bin/doxygen        image/Doxygen.app/Contents/Resources
        cp doxygen/build/bin/doxyindexer    image/Doxygen.app/Contents/Resources
        cp doxygen/build/bin/doxysearch.cgi image/Doxygen.app/Contents/Resources
        cp doxygen/build/bin/doxywizard     image/Doxygen.app/Contents/MacOS/Doxywizard
        xattr -c -r image/Doxygen.app

#------------------------------------- Sign the Doxygen executables for macOS

    - name: Codesign executable (macOS)
      if: runner.os == 'macOS' && github.repository == 'doxygen/doxygen-release' # Do not run signing step on forks
      env:
        MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        MACOS_SIGNID: ${{ secrets.MACOS_SIGNID }}
      shell: bash
      run: |
        # Decode certificate
        echo "--- decoding certificate"
        echo $MACOS_CERTIFICATE | base64 --decode > certificate.p12

        # Create keychain
        echo "--- creating keychain"
        security create-keychain -p DoxygenPW build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p DoxygenPW build.keychain
        security set-keychain-settings -t 3600 -u build.keychain

        # Import certificate
        echo "--- importing certificate"
        security import certificate.p12 -k build.keychain -P $MACOS_CERTIFICATE_PWD -T /usr/bin/codesign

        # Key signing
        echo "--- signing key"
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k DoxygenPW build.keychain

        # Debug
        echo "--- finding indentity"
        security find-identity -v build.keychain

        # Sign code
        echo "--- signing executables in the DMG"
        codesign --force --option=runtime -s $MACOS_SIGNID image/Doxygen.app/Contents/Resources/doxygen -v
        codesign --force --option=runtime -s $MACOS_SIGNID image/Doxygen.app/Contents/Resources/doxyindexer -v
        codesign --force --option=runtime -s $MACOS_SIGNID image/Doxygen.app/Contents/Resources/doxysearch.cgi -v
        codesign --force --option=runtime --deep -s $MACOS_SIGNID image/Doxygen.app/Contents/MacOS/Doxywizard -v
        codesign --force --option=runtime -s $MACOS_SIGNID image/Doxygen.app -v

        echo "--- signing executables in the zip"
        codesign --force -s $MACOS_SIGNID doxygen/build/bin/doxygen -v
        codesign --force -s $MACOS_SIGNID doxygen/build/bin/doxyindexer -v
        codesign --force -s $MACOS_SIGNID doxygen/build/bin/doxysearch.cgi -v

        # Verify signing
        echo "--- verifying signing"
        codesign -v image/Doxygen.app/Contents/Resources/doxygen --verbose
        codesign -v image/Doxygen.app/Contents/Resources/doxyindexer --verbose
        codesign -v image/Doxygen.app/Contents/Resources/doxysearch.cgi --verbose
        codesign -v image/Doxygen.app/Contents/MacOS/Doxywizard --verbose
        codesign -v image/Doxygen.app --verbose

#------------------------------------- Create Doxygen installation artifacts for macOS (2/2)

    - name: Create Doxygen installer 2/2 (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        VERSION=${{ steps.doxygen-version.outputs.version }}
        /usr/sbin/diskutil rename image Doxygen
        hdiutil detach image

        hdiutil convert -format UDCO -o installer/Doxygen-$VERSION-${{ matrix.cpu }}.dmg macos/template.sparseimage
        xattr -c installer/Doxygen-$VERSION-${{ matrix.cpu }}.dmg

        # Create zip with binaries
        mkdir -p doxygen-$VERSION
        cp doxygen/build/bin/doxygen        doxygen-$VERSION
        cp doxygen/build/bin/doxyindexer    doxygen-$VERSION
        cp doxygen/build/bin/doxysearch.cgi doxygen-$VERSION
        xattr -c -r doxygen-$VERSION
        zip -r installer/doxygen-$VERSION-mac-${{ matrix.cpu }}.zip doxygen-$VERSION

#------------------------------------- Notarize the Doxygen executables for macOS

    - name: Notarization and Stapling (macOS)
      if: runner.os == 'macOS' && github.repository == 'doxygen/doxygen-release' # Do not run signing step on forks
      env:
        MACOS_SIGNID: ${{ secrets.MACOS_SIGNID }}
        MACOS_NOTARIZATION_USER: ${{ secrets.MACOS_NOTARIZATION_USER }}
        MACOS_NOTARIZATION_PWD: ${{ secrets.MACOS_NOTARIZATION_PWD }}
      shell: bash
      run: |
        xcrun notarytool submit installer/Doxygen-${{ steps.doxygen-version.outputs.version }}-${{ matrix.cpu }}.dmg --apple-id $MACOS_NOTARIZATION_USER --team-id $MACOS_SIGNID --password $MACOS_NOTARIZATION_PWD --output-format json --wait
        xcrun stapler staple installer/Doxygen-${{ steps.doxygen-version.outputs.version }}-${{ matrix.cpu }}.dmg

#------------------------------------- Create Doxygen installation artifacts for Linux

    - name: Create installer (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        VERSION=${{ steps.doxygen-version.outputs.version }}
        mkdir -p installer/doxygen-$VERSION

        # Create source package
        tar -C doxygen --exclude bin -c -f doxygen-$VERSION.src.tar \
          doc doc_internal deps vhdlparser libxml libversion examples addon src testing templates cmake \
          CMakeLists.txt BUILD.txt INSTALL LANGUAGE.HOWTO LICENSE README.md VERSION
        cd installer/doxygen-$VERSION
        tar xf ../../doxygen-$VERSION.src.tar
        cd ..
        tar zcvf doxygen-$VERSION.src.tar.gz doxygen-$VERSION
        rm -rf doxygen-$VERSION
        cd ..

        # Create PDF version of the manual
        cp doxygen/build/latex/doxygen_manual.pdf installer/doxygen_manual-$VERSION.pdf
        cd installer
        zip -m doxygen_manual-$VERSION.pdf.zip doxygen_manual-$VERSION.pdf
        cd ..

        # Create binary package for Linux
        DESTDIR=package/doxygen-$VERSION
        mkdir -p $DESTDIR
        cat linux/README.bin | sed -e "s/\$VERSION/$VERSION/g" -e "s/\$DATE/`date +\"%d %B %Y\"`/g" >$DESTDIR/README
        cp doxygen/LICENSE $DESTDIR
        cp linux/Makefile.bin.in $DESTDIR/Makefile
        cat doxygen/INSTALL | sed -e "s/\$VERSION/$VERSION/g" -e "s/\$DATE/`date +\"%d %B %Y\"`/g" >$DESTDIR/INSTALL
        mkdir $DESTDIR/bin
        mkdir -p $DESTDIR/man/man1
        cp -a doxygen/build/html $DESTDIR
        cp -a doxygen/build/examples $DESTDIR
        cp doxygen/build/bin/doxygen $DESTDIR/bin
        cp doxygen/build/latex/doxygen_manual.pdf $DESTDIR/doxygen_manual-$VERSION.pdf
        cp doxygen/build/bin/doxyindexer $DESTDIR/bin
        cp doxygen/build/bin/doxysearch.cgi $DESTDIR/bin
        cp doxygen/build/bin/doxywizard $DESTDIR/bin
        cp doxygen/build/man/*.1 $DESTDIR/man/man1
        gzip $DESTDIR/man/man1/*
        tar -C package -z -c -v -f installer/doxygen-$VERSION.linux.bin.tar.gz doxygen-$VERSION

#------------------------------------- Upload individual artifacts

    - name: Upload Doxygen build (Windows/setup.exe)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v6
      with:
        name: doxygen-${{ steps.doxygen-version.outputs.version }}-setup.exe
        path: installer/doxygen-${{ steps.doxygen-version.outputs.version }}-setup.exe

    - name: Upload Doxygen build (Windows/doxygen-x64.zip)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v6
      with:
        name: doxygen-${{ steps.doxygen-version.outputs.version }}.windows.x64.bin.zip
        path: installer/doxygen-${{ steps.doxygen-version.outputs.version }}.windows.x64.bin.zip

    - name: Upload Doxygen build (Windows/doxygen_manual.chm)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v6
      with:
        name: doxygen_manual-${{ steps.doxygen-version.outputs.version }}.chm.zip
        path: installer/doxygen_manual-${{ steps.doxygen-version.outputs.version }}.chm.zip

    - name: Upload Doxygen build (macOS/doxygen.dmg)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v6
      with:
        name: Doxygen-${{ steps.doxygen-version.outputs.version }}-${{ matrix.cpu }}.dmg
        path: installer/Doxygen-${{ steps.doxygen-version.outputs.version }}-${{ matrix.cpu }}.dmg

    - name: Upload Doxygen build (macOS/doxygen-mac.zip)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v6
      with:
        name: doxygen-${{ steps.doxygen-version.outputs.version }}-mac-${{ matrix.cpu }}.zip
        path: installer/doxygen-${{ steps.doxygen-version.outputs.version }}-mac-${{ matrix.cpu }}.zip

    - name: Upload Doxygen build (Linux/doxygen.src.tar.gz)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v6
      with:
        name: doxygen-${{ steps.doxygen-version.outputs.version }}.src.tar.gz
        path: installer/doxygen-${{ steps.doxygen-version.outputs.version }}.src.tar.gz

    - name: Upload Doxygen build (Linux/doxygen.linux.bin.tar.gz)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v6
      with:
        name: doxygen-${{ steps.doxygen-version.outputs.version }}.linux.bin.tar.gz
        path: installer/doxygen-${{ steps.doxygen-version.outputs.version }}.linux.bin.tar.gz

    - name: Upload Doxygen build (Linux/doxygen_manual.pdf.zip)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v6
      with:
        name: doxygen_manual-${{ steps.doxygen-version.outputs.version }}.pdf.zip
        path: installer/doxygen_manual-${{ steps.doxygen-version.outputs.version }}.pdf.zip
